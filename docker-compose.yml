services:
  db:
    image: postgres:15-alpine
    container_name: compass-db
    restart: always
    environment:
      POSTGRES_DB: rk_compass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: compass_password
    ports:
      - "5433:5432"
    volumes:
      - compass-db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: compass-app
    restart: always
    depends_on:
      - db
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      DATABASE_URL: postgresql://postgres:compass_password@db:5432/rk_compass
    command: sh -c "node migrate.cjs && node server.cjs"

volumes:
  compass-db-data:
